<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Uren Tracker - Offline First & Synology Export</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // LocalStorage Keys
      const STORAGE_EMPLOYERS = 'uren_tracker_employers_v1';
      const STORAGE_SHIFTS = 'uren_tracker_shifts_v1';
      const STORAGE_SYNOLOGY = 'uren_tracker_synology_config_v1';

      const DEFAULT_EMPLOYERS = [
        { id: 'emp_1', name: 'Albert Heijn', hourlyWage: 14.50, color: '#10B981', notes: 'Filiaal Centrum', isDefault: true },
        { id: 'emp_2', name: 'Horeca De Markt', hourlyWage: 16.00, color: '#F59E0B', notes: 'Avond- & weekendwerk', isDefault: false }
      ];

      const SAMPLE_SHIFTS = [
        { id: 's_1', employerId: 'emp_1', date: new Date().toISOString().split('T')[0], startTime: '08:00', endTime: '16:30', breakMinutes: 30, isLateCancelled: false, location: 'Kassa 3', notes: '' },
        { id: 's_2', employerId: 'emp_2', date: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0], startTime: '17:00', endTime: '23:00', breakMinutes: 15, isLateCancelled: true, location: 'Bar', notes: 'Afgebeld 2u voor aanvang (art. 7:628 BW)' }
      ];

      // Helper Calculations
      function parseTimeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
      }

      function calcShiftHours(shift, employer) {
        const start = parseTimeToMinutes(shift.startTime);
        let end = parseTimeToMinutes(shift.endTime);
        if (end < start) end += 24 * 60; // Nachtdienst
        
        const grossMinutes = Math.max(0, end - start);
        const netMinutes = Math.max(0, grossMinutes - (shift.breakMinutes || 0));
        const netHours = netMinutes / 60;
        const hourlyWage = shift.customHourlyWage ?? (employer ? employer.hourlyWage : 0);
        const totalEarnings = netHours * hourlyWage;

        return { grossMinutes, netMinutes, netHours, hourlyWage, totalEarnings };
      }

      function formatCurrency(amount) {
        return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(amount || 0);
      }

      function formatDecimalHours(hours) {
        const h = Math.floor(hours || 0);
        const m = Math.round(((hours || 0) - h) * 60);
        return `${h}u ${m}m`;
      }

      // App Main Component
      function App() {
        const [employers, setEmployers] = useState(() => {
          const saved = localStorage.getItem(STORAGE_EMPLOYERS);
          return saved ? JSON.parse(saved) : DEFAULT_EMPLOYERS;
        });

        const [shifts, setShifts] = useState(() => {
          const saved = localStorage.getItem(STORAGE_SHIFTS);
          return saved ? JSON.parse(saved) : SAMPLE_SHIFTS;
        });

        const [synologyConfig, setSynologyConfig] = useState(() => {
          const saved = localStorage.getItem(STORAGE_SYNOLOGY);
          return saved ? JSON.parse(saved) : { apiUrl: '', apiKey: '' };
        });

        const [selectedEmployerId, setSelectedEmployerId] = useState('all');
        const [activeTab, setActiveTab] = useState('overview'); // overview, stats, employers, export
        const [isAddModalOpen, setIsAddModalOpen] = useState(false);
        const [editingShift, setEditingShift] = useState(null);
        const [synologyStatus, setSynologyStatus] = useState(null);
        const [isSendingSynology, setIsSendingSynology] = useState(false);

        useEffect(() => {
          localStorage.setItem(STORAGE_EMPLOYERS, JSON.stringify(employers));
        }, [employers]);

        useEffect(() => {
          localStorage.setItem(STORAGE_SHIFTS, JSON.stringify(shifts));
        }, [shifts]);

        useEffect(() => {
          localStorage.setItem(STORAGE_SYNOLOGY, JSON.stringify(synologyConfig));
        }, [synologyConfig]);

        // Filtered Shifts
        const filteredShifts = useMemo(() => {
          return shifts.filter(s => selectedEmployerId === 'all' || s.employerId === selectedEmployerId)
                       .sort((a, b) => new Date(b.date) - new Date(a.date));
        }, [shifts, selectedEmployerId]);

        // Totals
        const totals = useMemo(() => {
          let totalNetHours = 0;
          let totalEarnings = 0;
          let lateCancelledCount = 0;

          filteredShifts.forEach(shift => {
            const emp = employers.find(e => e.id === shift.employerId);
            const calc = calcShiftHours(shift, emp);
            totalNetHours += calc.netHours;
            totalEarnings += calc.totalEarnings;
            if (shift.isLateCancelled) lateCancelledCount++;
          });

          return { totalNetHours, totalEarnings, lateCancelledCount, totalShifts: filteredShifts.length };
        }, [filteredShifts, employers]);

        // Handlers
        const handleSaveShift = (shiftData) => {
          if (editingShift) {
            setShifts(shifts.map(s => s.id === editingShift.id ? { ...shiftData, id: s.id } : s));
          } else {
            setShifts([{ ...shiftData, id: 'shift_' + Date.now() }, ...shifts]);
          }
          setIsAddModalOpen(false);
          setEditingShift(null);
        };

        const handleDeleteShift = (id) => {
          if (confirm('Weet je zeker dat je deze dienst wilt verwijderen?')) {
            setShifts(shifts.filter(s => s.id !== id));
          }
        };

        const handleSendToSynology = async () => {
          if (!synologyConfig.apiUrl) {
            setSynologyStatus({ success: false, message: 'Vul eerst je Synology Webhook / API URL in.' });
            return;
          }
          setIsSendingSynology(true);
          setSynologyStatus(null);

          const payload = {
            app: 'UrenTracker',
            exportedAt: new Date().toISOString(),
            employers,
            shifts
          };

          try {
            const headers = { 'Content-Type': 'application/json' };
            if (synologyConfig.apiKey) headers['Authorization'] = `Bearer ${synologyConfig.apiKey}`;

            const res = await fetch(synologyConfig.apiUrl.trim(), {
              method: 'POST',
              headers,
              body: JSON.stringify(payload)
            });

            setIsSendingSynology(false);
            if (res.ok) {
              setSynologyStatus({ success: true, message: `Succesvol verzonden naar Synology NAS (${res.status})!` });
            } else {
              setSynologyStatus({ success: false, message: `Synology NAS gaf foutcode ${res.status}.` });
            }
          } catch (err) {
            setIsSendingSynology(false);
            setSynologyStatus({ success: false, message: `Kon geen verbinding maken (${err.message}). Staat de NAS aan?` });
          }
        };

        const handleDownloadJSON = () => {
          const blob = new Blob([JSON.stringify({ employers, shifts }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `uren-backup-${new Date().toISOString().split('T')[0]}.json`;
          a.click();
        };

        return (
          <div className="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col pb-20">
            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-20">
              <div className="px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold text-sm shadow-xs">
                    ⏱️
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <h1 className="font-bold text-base leading-tight">Uren Tracker</h1>
                      <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.2 rounded-md">Offline First</span>
                    </div>
                    <p className="text-[11px] text-slate-400 font-medium">LocalStorage & Synology Export</p>
                  </div>
                </div>
                
                <button
                  onClick={() => { setEditingShift(null); setIsAddModalOpen(true); }}
                  className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-xs flex items-center gap-1"
                >
                  + Dienst
                </button>
              </div>

              {/* Sub-bar */}
              <div className="bg-slate-50 px-4 py-1.5 border-t border-slate-100 flex items-center justify-between text-xs">
                <select
                  value={selectedEmployerId}
                  onChange={e => setSelectedEmployerId(e.target.value)}
                  className="bg-white border border-slate-200 text-slate-800 rounded-lg text-xs font-semibold px-2 py-0.5 focus:outline-none"
                >
                  <option value="all">Alle Werkgevers</option>
                  {employers.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                </select>

                <button
                  onClick={() => setActiveTab('export')}
                  className="text-emerald-700 bg-emerald-100 hover:bg-emerald-200 font-bold px-2.5 py-0.5 rounded-lg text-[11px] transition-all"
                >
                  💾 Synology / JSON
                </button>
              </div>
            </header>

            {/* Content Tabs */}
            <main className="p-4 flex-1 space-y-4">
              {/* Summary Cards */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-50 border border-slate-200/80 p-3.5 rounded-2xl">
                  <span className="text-[11px] font-semibold text-slate-400 block mb-0.5">Totaal Uren</span>
                  <span className="text-xl font-black text-slate-900">{formatDecimalHours(totals.totalNetHours)}</span>
                  <span className="text-[10px] text-slate-400 block mt-1">{totals.totalShifts} ingevoerde diensten</span>
                </div>
                <div className="bg-emerald-500 text-white p-3.5 rounded-2xl shadow-xs">
                  <span className="text-[11px] font-semibold text-emerald-100 block mb-0.5">Verwacht Loon</span>
                  <span className="text-xl font-black">{formatCurrency(totals.totalEarnings)}</span>
                  {totals.lateCancelledCount > 0 && (
                    <span className="text-[10px] text-emerald-100 block mt-1">Incl. {totals.lateCancelledCount}x te laat geannuleerd</span>
                  )}
                </div>
              </div>

              {/* TAB 1: OVERVIEW */}
              {activeTab === 'overview' && (
                <div className="space-y-3">
                  <h2 className="font-bold text-sm text-slate-800">Diensten Overzicht ({filteredShifts.length})</h2>
                  {filteredShifts.length === 0 ? (
                    <div className="text-center py-8 text-slate-400 text-xs bg-slate-50 rounded-2xl border border-dashed border-slate-200 p-4">
                      Geen diensten gevonden. Klik op '+ Dienst' om er een toe te voegen.
                    </div>
                  ) : (
                    filteredShifts.map(shift => {
                      const emp = employers.find(e => e.id === shift.employerId);
                      const calc = calcShiftHours(shift, emp);

                      return (
                        <div key={shift.id} className="bg-white border border-slate-200/90 rounded-2xl p-3.5 space-y-2 shadow-2xs">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: emp?.color || '#10B981' }} />
                              <span className="font-bold text-xs text-slate-900">{emp?.name || 'Onbekend'}</span>
                            </div>
                            <span className="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-lg">
                              {shift.date}
                            </span>
                          </div>

                          <div className="flex items-baseline justify-between pt-1">
                            <div>
                              <div className="text-sm font-bold text-slate-800">
                                {shift.startTime} - {shift.endTime}
                              </div>
                              <div className="text-xs text-slate-400 font-medium">
                                Pauze: {shift.breakMinutes} min. • Netto: {formatDecimalHours(calc.netHours)}
                              </div>
                            </div>
                            <div className="text-right">
                              <div className={`text-base font-black ${shift.isLateCancelled ? 'text-rose-600' : 'text-emerald-600'}`}>
                                {formatCurrency(calc.totalEarnings)}
                              </div>
                              <div className="text-[10px] text-slate-400 font-medium">
                                €{calc.hourlyWage.toFixed(2)}/u
                              </div>
                            </div>
                          </div>

                          {shift.isLateCancelled && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-800 text-[11px] p-2 rounded-xl font-semibold">
                              ⚠️ Te laat geannuleerd (&lt;24u) — 100% doorbetaling i.v.m. art. 7:628 BW.
                            </div>
                          )}

                          <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100 text-xs">
                            <button
                              onClick={() => { setEditingShift(shift); setIsAddModalOpen(true); }}
                              className="text-slate-500 hover:text-slate-800 font-semibold px-2 py-1"
                            >
                              Bewerken
                            </button>
                            <button
                              onClick={() => handleDeleteShift(shift.id)}
                              className="text-rose-600 hover:text-rose-700 font-semibold px-2 py-1"
                            >
                              Verwijderen
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}

              {/* TAB 4: SYNOLOGY & EXPORT */}
              {activeTab === 'export' && (
                <div className="space-y-4">
                  <div className="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl">
                    <h3 className="font-bold text-xs text-emerald-950 mb-1">🟢 Offline First Actief</h3>
                    <p className="text-xs text-emerald-800 leading-relaxed">
                      Alle gegevens staan direct opgeslagen in LocalStorage op je telefoon.
                    </p>
                  </div>

                  <div className="bg-white border border-slate-200 p-4 rounded-2xl space-y-3">
                    <h3 className="font-bold text-xs text-slate-900">Synology NAS Exporter</h3>
                    <p className="text-xs text-slate-500">Stuur alle uren via HTTP POST rechtstreeks naar je Synology NAS API/Webhook.</p>
                    
                    <input
                      type="url"
                      placeholder="http://192.168.1.100:5000/api/uren"
                      value={synologyConfig.apiUrl}
                      onChange={e => setSynologyConfig({ ...synologyConfig, apiUrl: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none"
                    />

                    <button
                      onClick={handleSendToSynology}
                      disabled={isSendingSynology}
                      className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-xs"
                    >
                      {isSendingSynology ? 'Bezig met verzenden...' : 'Verstuur naar Synology NAS'}
                    </button>

                    {synologyStatus && (
                      <div className={`p-2.5 rounded-xl text-xs font-semibold ${synologyStatus.success ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-50 text-rose-800'}`}>
                        {synologyStatus.message}
                      </div>
                    )}
                  </div>

                  <div className="bg-white border border-slate-200 p-4 rounded-2xl space-y-2">
                    <h3 className="font-bold text-xs text-slate-900">JSON Backup Bestand</h3>
                    <p className="text-xs text-slate-500">Download of bewaar de gegevens als los .json bestand.</p>
                    <button
                      onClick={handleDownloadJSON}
                      className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs"
                    >
                      Download Backup JSON
                    </button>
                  </div>
                </div>
              )}
            </main>

            {/* Bottom Nav */}
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-6 py-2 flex items-center justify-around z-20">
              <button
                onClick={() => setActiveTab('overview')}
                className={`text-xs font-bold flex flex-col items-center ${activeTab === 'overview' ? 'text-emerald-600' : 'text-slate-400'}`}
              >
                <span>📋</span>
                Diensten
              </button>
              <button
                onClick={() => setActiveTab('export')}
                className={`text-xs font-bold flex flex-col items-center ${activeTab === 'export' ? 'text-emerald-600' : 'text-slate-400'}`}
              >
                <span>💾</span>
                Synology / JSON
              </button>
            </nav>

            {/* Modal Form Placeholder */}
            {isAddModalOpen && (
              <ShiftModal
                editingShift={editingShift}
                employers={employers}
                onClose={() => setIsAddModalOpen(false)}
                onSave={handleSaveShift}
              />
            )}
          </div>
        );
      }

      function ShiftModal({ editingShift, employers, onClose, onSave }) {
        const [employerId, setEmployerId] = useState(editingShift?.employerId || employers[0]?.id || '');
        const [date, setDate] = useState(editingShift?.date || new Date().toISOString().split('T')[0]);
        const [startTime, setStartTime] = useState(editingShift?.startTime || '08:00');
        const [endTime, setEndTime] = useState(editingShift?.endTime || '16:30');
        const [breakMinutes, setBreakMinutes] = useState(editingShift?.breakMinutes ?? 30);
        const [isLateCancelled, setIsLateCancelled] = useState(editingShift?.isLateCancelled || false);

        const handleSubmit = (e) => {
          e.preventDefault();
          onSave({ employerId, date, startTime, endTime, breakMinutes, isLateCancelled });
        };

        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-2xl max-w-xs w-full p-4 space-y-3 shadow-2xl">
              <h3 className="font-bold text-base text-slate-900">{editingShift ? 'Dienst Bewerken' : 'Nieuwe Dienst'}</h3>
              <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                <div>
                  <label className="block font-semibold mb-1">Werkgever</label>
                  <select value={employerId} onChange={e => setEmployerId(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl">
                    {employers.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-semibold mb-1">Datum</label>
                  <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Starttijd</label>
                    <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Eindtijd</label>
                    <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full bg-slate-50 border p-2 rounded-xl" />
                  </div>
                </div>
                <div>
                  <label className="block font-semibold mb-1">Pauze (minuten)</label>
                  <input type="number" value={breakMinutes} onChange={e => setBreakMinutes(Number(e.target.value))} className="w-full bg-slate-50 border p-2 rounded-xl" />
                </div>
                <div className="bg-rose-50 p-2.5 rounded-xl border border-rose-200">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={isLateCancelled} onChange={e => setIsLateCancelled(e.target.checked)} className="w-4 h-4 rounded text-rose-600" />
                    <span className="font-bold text-rose-900">Te laat geannuleerd (&lt;24u)</span>
                  </label>
                </div>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={onClose} className="w-1/2 py-2 text-slate-500 font-semibold">Annuleren</button>
                  <button type="submit" className="w-1/2 bg-emerald-500 text-white py-2 rounded-xl font-bold">Opslaan</button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
