<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uren Tracker - Secure & Offline Single-Page App for GitHub Pages</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN with Crossorigin -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

</head>

    const IconTrash = ({ className = "w-4 h-4" }) => (

    );
    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
    );
    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
    );
    const IconSend = ({ className = "w-4 h-4" }) => (

    const IconShield = ({ className = "w-4 h-4" }) => (

    );
    const IconDownload = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>

    );
    const IconLock = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
    );
    const IconEye = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
    );
    const IconEyeOff = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" /></svg>
    );
    const IconFileSpreadsheet = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
    );
    const IconFilter = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
    );

    // --- LOCAL STORAGE KEYS & PRODUCTION DEFAULTS ---
    const STORAGE_EMPLOYERS_KEY = 'uren_tracker_employers_v1';
    const STORAGE_SHIFTS_KEY = 'uren_tracker_shifts_v1';
    const STORAGE_SYNOLOGY_KEY = 'uren_tracker_synology_config_v1';
    const STORAGE_SETTINGS_KEY = 'uren_tracker_settings_v1';
    const STORAGE_TIMER_KEY = 'uren_tracker_active_timer_v1';

    const DEFAULT_EMPLOYERS = [
      { id: 'emp-1', name: 'Werkgever A', hourlyWage: 15.00, color: '#10B981', isDefault: true, notes: 'Hoofdbaan' },
      { id: 'emp-2', name: 'Werkgever B', hourlyWage: 17.50, color: '#3B82F6', isDefault: false, notes: 'Bijbaan / Projecten' }
    ];

    const DEFAULT_SETTINGS = {
      defaultBreakMinutes: 30,
      defaultShiftDurationHours: 8,
      lateCancellationHoursThreshold: 24,
      currencySymbol: '€'
    };

    const DEFAULT_SYNOLOGY = {
      apiUrl: '',
      apiKey: '',
      autoSyncOnSave: false
    };

    const SAMPLE_SHIFTS = [
      {
        id: 'shift-1',
        employerId: 'emp-1',
        date: new Date().toISOString().split('T')[0],
        startTime: '08:30',
        endTime: '17:00',
        breakMinutes: 30,
        surchargePercentage: 100,
        notes: 'Dagdienst - Reguliere uren'
      }
    ];

    // Storage utility functions
    function loadEmployers() {
      try {
        const data = localStorage.getItem(STORAGE_EMPLOYERS_KEY);
        return data ? JSON.parse(data) : DEFAULT_EMPLOYERS;
      } catch (e) { return DEFAULT_EMPLOYERS; }
    }

    function saveEmployers(data) {
      localStorage.setItem(STORAGE_EMPLOYERS_KEY, JSON.stringify(data));
    }

    function loadShifts() {
      try {
        const data = localStorage.getItem(STORAGE_SHIFTS_KEY);
        return data ? JSON.parse(data) : SAMPLE_SHIFTS;
      } catch (e) { return SAMPLE_SHIFTS; }
    }

    function saveShifts(data) {
      localStorage.setItem(STORAGE_SHIFTS_KEY, JSON.stringify(data));
    }

    function loadAppSettings() {
      try {
        const data = localStorage.getItem(STORAGE_SETTINGS_KEY);
        return data ? { ...DEFAULT_SETTINGS, ...JSON.parse(data) } : DEFAULT_SETTINGS;
      } catch (e) { return DEFAULT_SETTINGS; }
    }

    function saveAppSettings(data) {
      localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(data));
    }

    function loadSynologyConfig() {
      try {
        const data = localStorage.getItem(STORAGE_SYNOLOGY_KEY);
        return data ? { ...DEFAULT_SYNOLOGY, ...JSON.parse(data) } : DEFAULT_SYNOLOGY;
      } catch (e) { return DEFAULT_SYNOLOGY; }
    }

    function saveSynologyConfig(data) {
      localStorage.setItem(STORAGE_SYNOLOGY_KEY, JSON.stringify(data));
    }

    function loadActiveTimer() {
      try {
        const data = localStorage.getItem(STORAGE_TIMER_KEY);
        return data ? JSON.parse(data) : null;
      } catch (e) { return null; }
    }

    function saveActiveTimer(data) {
      if (data) {
        localStorage.setItem(STORAGE_TIMER_KEY, JSON.stringify(data));
      } else {
        localStorage.removeItem(STORAGE_TIMER_KEY);
      }
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function calculateShiftEarnings(shift, employers) {
      const emp = employers.find(e => e.id === shift.employerId);
      const wage = shift.hourlyWageOverride !== undefined ? shift.hourlyWageOverride : (emp ? emp.hourlyWage : 0);

      const start = parseTimeToMinutes(shift.startTime);
      let end = parseTimeToMinutes(shift.endTime);
      if (end <= start) end += 24 * 60; // Nachtdienst

      const totalMinutes = end - start;
      const netMinutes = Math.max(0, totalMinutes - (shift.breakMinutes || 0));
      const netHours = netMinutes / 60;

      const multiplier = (shift.surchargePercentage || 100) / 100;
      const earnings = netHours * wage * multiplier;

      return { netHours, earnings, hourlyWageUsed: wage };
    }

    // --- EXCEL EXPORT HELPER (SheetJS / XLSX) ---
    function exportToExcel(shifts, employers) {
      if (typeof XLSX === 'undefined') {
        alert('De Excel-bibliotheek (SheetJS) kon niet geladen worden. Controleer je internetverbinding.');
        return;
      }

      const rows = shifts.map(shift => {
        const emp = employers.find(e => e.id === shift.employerId);
        const calc = calculateShiftEarnings(shift, employers);

        return {
          'Datum': shift.date,
          'Werkgever / Klant': emp ? emp.name : 'Onbekend',
          'Begintijd': shift.startTime,
          'Eindtijd': shift.endTime,
          'Pauze (minuten)': shift.breakMinutes || 0,
          'Totaal Uren': Number(calc.netHours.toFixed(2)),
          'Uurloon (€)': Number(calc.hourlyWageUsed.toFixed(2)),
          'Totaal Verdient (€)': Number(calc.earnings.toFixed(2)),
          'Locatie / Notitie': shift.notes || ''
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);

      // Kolombreedtes instellen
      worksheet['!cols'] = [
        { wch: 12 },
        { wch: 20 },
        { wch: 10 },
        { wch: 10 },
        { wch: 15 },
        { wch: 12 },
        { wch: 12 },
        { wch: 18 },
        { wch: 30 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Urenoverzicht');

      const today = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `Urenoverzicht_${today}.xlsx`);
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [employers, setEmployers] = useState(loadEmployers);
      const [shifts, setShifts] = useState(loadShifts);
      const [settings, setSettings] = useState(loadAppSettings);
      const [synology, setSynology] = useState(loadSynologyConfig);
      
      // Live Clock-In Timer State
      const [timer, setTimer] = useState(loadActiveTimer);
      const [now, setNow] = useState(Date.now());

      // Filters
      const [selectedEmployerId, setSelectedEmployerId] = useState('all');
      const [selectedMonth, setSelectedMonth] = useState('all'); // 'all' of 'YYYY-MM'
      const [activeTab, setActiveTab] = useState('overview');

      // Modals
      const [isShiftModalOpen, setIsShiftModalOpen] = useState(false);
      const [editingShift, setEditingShift] = useState(null);
      const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Save handlers
      useEffect(() => { saveEmployers(employers); }, [employers]);
      useEffect(() => { saveShifts(shifts); }, [shifts]);
      useEffect(() => { saveActiveTimer(timer); }, [timer]);

      // Timer interval ticker (updates every second)
      useEffect(() => {
        const interval = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(interval);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      // --- LIVE TIMER LOGIC ---
      const handleClockIn = (empId) => {
        const startTime = Date.now();
        const dateObj = new Date(startTime);
        const startClockTime = dateObj.toTimeString().substring(0, 5); // 'HH:MM'
        const startDateStr = dateObj.toISOString().split('T')[0];

        const newTimer = {
          startTime,
          startClockTime,
          startDateStr,
          employerId: empId || (employers[0] ? employers[0].id : ''),
          isPaused: false,
          pauseStartTime: null,
          totalPauseMs: 0
        };

        setTimer(newTimer);
        showToast('Ingeklokt! Timer is gestart.');
      };

      const handleTogglePauseTimer = () => {
        if (!timer) return;
        if (timer.isPaused) {
          // Resume work
          const pauseDuration = Date.now() - timer.pauseStartTime;
          setTimer({
            ...timer,
            isPaused: false,
            pauseStartTime: null,
            totalPauseMs: timer.totalPauseMs + pauseDuration
          });
          showToast('Werk hervat!');
        } else {
          // Start pause
          setTimer({
            ...timer,
            isPaused: true,
            pauseStartTime: Date.now()
          });
          showToast('Pauze gestart!');
        }
      };

      const handleClockOut = () => {
        if (!timer) return;

        const clockOutTime = Date.now();
        const endDateObj = new Date(clockOutTime);
        const endClockTime = endDateObj.toTimeString().substring(0, 5); // 'HH:MM'
        
        let finalPauseMs = timer.totalPauseMs;
        if (timer.isPaused && timer.pauseStartTime) {
          finalPauseMs += (clockOutTime - timer.pauseStartTime);
        }

        const totalPauseMinutes = Math.round(finalPauseMs / (1000 * 60));

        // Open shift modal pre-filled with live tracked data
        setEditingShift({
          id: `shift-${Date.now()}`,
          employerId: timer.employerId,
          date: timer.startDateStr,
          startTime: timer.startClockTime,
          endTime: endClockTime,
          breakMinutes: totalPauseMinutes,
          notes: 'Automatisch geregistreerd via Live Timer'
        });

        setTimer(null);
        setIsShiftModalOpen(true);
      };

      const handleCancelTimer = () => {
        if (confirm('Weet je zeker dat je de lopende timer wilt annuleren zonder op te slaan?')) {
          setTimer(null);
          showToast('Timer geannuleerd.');
        }
      };

      // Employers Handlers
      const handleSaveEmployer = (emp) => {
        setEmployers(prev => {
          const exists = prev.some(e => e.id === emp.id);
          if (exists) return prev.map(e => e.id === emp.id ? emp : e);
          return [...prev, emp];
        });
        showToast(`Werkgever "${emp.name}" opgeslagen.`);
      };

      const handleDeleteEmployer = (id) => {
        if (employers.length <= 1) return alert('Minimaal één werkgever vereist.');
        setEmployers(prev => prev.filter(e => e.id !== id));
        setShifts(prev => prev.filter(s => s.employerId !== id));
        showToast('Werkgever verwijderd.');
      };

      const handleSetDefaultEmployer = (id) => {
        setEmployers(prev => prev.map(e => ({ ...e, isDefault: e.id === id })));
        showToast('Standaard werkgever bijgewerkt.');
      };

      // Shift Handlers
      const handleSaveShift = (shift) => {
        setShifts(prev => {
          const exists = prev.some(s => s.id === shift.id);
          if (exists) return prev.map(s => s.id === shift.id ? shift : s);
          return [shift, ...prev];
        });
        setIsShiftModalOpen(false);
        setEditingShift(null);
        showToast('Dienst opgeslagen!');
      };

      const handleDeleteShift = (id) => {
        setShifts(prev => prev.filter(s => s.id !== id));
        showToast('Dienst verwijderd.');
      };

      // Total Reset Handler (Wipe All Local Storage Data)
      const handleWipeAllData = () => {
        localStorage.removeItem(STORAGE_EMPLOYERS_KEY);
        localStorage.removeItem(STORAGE_SHIFTS_KEY);
        localStorage.removeItem(STORAGE_SYNOLOGY_KEY);
        localStorage.removeItem(STORAGE_SETTINGS_KEY);
        localStorage.removeItem(STORAGE_TIMER_KEY);

        setEmployers(DEFAULT_EMPLOYERS);
        setShifts(SAMPLE_SHIFTS);
        setSettings(DEFAULT_SETTINGS);
        setSynology(DEFAULT_SYNOLOGY);
        setTimer(null);
        showToast('Alle gegevens zijn volledig gewist!');
      };

      // Restore JSON Backup Handler
      const handleRestoreBackup = (restoredData) => {
        if (restoredData.employers && Array.isArray(restoredData.employers)) {
          setEmployers(restoredData.employers);
        }
        if (restoredData.shifts && Array.isArray(restoredData.shifts)) {
          setShifts(restoredData.shifts);
        }
        if (restoredData.settings) {
          setSettings({ ...DEFAULT_SETTINGS, ...restoredData.settings });
        }
        if (restoredData.synology) {
          setSynology({ ...DEFAULT_SYNOLOGY, ...restoredData.synology });
        }
        showToast('Back-up succesvol hersteld!');
      };

      // Extract unique available YYYY-MM months from shifts for filter dropdown
      const availableMonths = Array.from(
        new Set(shifts.map(s => s.date ? s.date.substring(0, 7) : ''))
      ).filter(Boolean).sort().reverse();

      // Filtered Shifts Calculation
      const filteredShifts = shifts.filter(s => {
        const matchesEmployer = selectedEmployerId === 'all' || s.employerId === selectedEmployerId;
        const matchesMonth = selectedMonth === 'all' || (s.date && s.date.startsWith(selectedMonth));
        return matchesEmployer && matchesMonth;
      });

      // Calculations for current selection
      const totalStats = filteredShifts.reduce((acc, s) => {
        const calc = calculateShiftEarnings(s, employers);
        return {
          hours: acc.hours + calc.netHours,
          earnings: acc.earnings + calc.earnings
        };
      }, { hours: 0, earnings: 0 });

      // Live Timer elapsed formatting
      let elapsedSeconds = 0;
      let activePauseMinutes = 0;
      if (timer) {
        let currentEffectiveMs = now - timer.startTime - timer.totalPauseMs;
        if (timer.isPaused && timer.pauseStartTime) {
          currentEffectiveMs -= (now - timer.pauseStartTime);
          activePauseMinutes = Math.floor((timer.totalPauseMs + (now - timer.pauseStartTime)) / 60000);
        } else {
          activePauseMinutes = Math.floor(timer.totalPauseMs / 60000);
        }
        elapsedSeconds = Math.max(0, Math.floor(currentEffectiveMs / 1000));
      }

      const formatTimerHHMMSS = (sec) => {
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        const secs = sec % 60;
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="max-w-lg mx-auto bg-white min-h-screen shadow-xl flex flex-col pb-20 relative border-x border-slate-200">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2 animate-in fade-in">
              <IconCheck className="w-4 h-4 text-emerald-400" />
              <span>{toast}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="p-4 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-2xl bg-emerald-500 text-white flex items-center justify-center font-bold shadow-xs">
                  <IconSparkles className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="text-base font-bold text-slate-900">Uren Tracker</h1>
                    <span className="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md border border-emerald-200/80">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                      GitHub Pages HTTPS
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">100% Lokaal & Privacy Vriendelijk</p>
                </div>
              </div>

              <button
                onClick={() => { setEditingShift(null); setIsShiftModalOpen(true); }}
                className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-xs transition-colors"
              >
                <IconPlus className="w-4 h-4" />
                <span>Nieuw</span>
              </button>
            </div>

            {/* FILTER & SUB BAR */}
            <div className="bg-slate-50 px-4 py-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-1.5 flex-wrap">
                <IconFilter className="w-3.5 h-3.5 text-slate-400" />
                
                {/* Werkgever Filter */}
                <select
                  value={selectedEmployerId}
                  onChange={e => setSelectedEmployerId(e.target.value)}
                  className="bg-white border border-slate-200 text-slate-800 text-xs font-bold py-1 px-2 rounded-lg"
                >
                  <option value="all">Alle werkgevers</option>
                  {employers.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                </select>

                {/* Maand / Jaar Filter */}
                <select
                  value={selectedMonth}
                  onChange={e => setSelectedMonth(e.target.value)}
                  className="bg-white border border-slate-200 text-slate-800 text-xs font-bold py-1 px-2 rounded-lg"
                >
                  <option value="all">Alle maanden</option>
                  {availableMonths.map(m => {
                    const [year, month] = m.split('-');
                    const dateObj = new Date(parseInt(year), parseInt(month) - 1, 1);
                    const monthName = dateObj.toLocaleString('nl-NL', { month: 'long', year: 'numeric' });
                    return <option key={m} value={m}>{monthName}</option>;
                  })}
                </select>
              </div>

              <button
                onClick={() => setIsSettingsModalOpen(true)}
                className="text-xs font-bold text-emerald-700 bg-emerald-100/80 px-2.5 py-1 rounded-lg flex items-center gap-1 hover:bg-emerald-100"
              >
                <IconSettings className="w-3.5 h-3.5" />
                Instellingen
              </button>
            </div>
          </header>

          {/* CONTENT AREA */}
          <main className="p-4 flex-1 space-y-4">
            
            {/* LIVE INKLOKKEN / TIMER CARD */}
            <div className="bg-slate-900 text-white rounded-2xl p-4 shadow-md space-y-3 relative overflow-hidden border border-slate-800">
              <div className="flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  <span className={`w-2.5 h-2.5 rounded-full ${timer ? (timer.isPaused ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400 animate-pulse') : 'bg-slate-600'}`} />
                  <span className="font-bold text-slate-200">
                    {timer ? (timer.isPaused ? '⏱️ In Pauze' : '🟢 Werk aan de gang') : '⏱️ Live Inklokken'}
                  </span>
                </div>

                {timer && (
                  <button
                    onClick={handleCancelTimer}
                    className="text-[10px] text-slate-400 hover:text-rose-400 font-semibold"
                  >
                    Annuleren
                  </button>
                )}
              </div>

              {timer ? (
                /* ACTIVE CLOCK-IN STATE */
                <div className="space-y-3 pt-1">
                  <div className="flex items-baseline justify-between border-t border-b border-slate-800 py-3">
                    <div>
                      <p className="text-[10px] text-slate-400 font-medium">Begonnen om {timer.startClockTime}</p>
                      <p className="text-3xl font-mono font-black text-emerald-400 tracking-wider">
                        {formatTimerHHMMSS(elapsedSeconds)}
                      </p>
                    </div>
                    <div className="text-right">
                      <p className="text-[10px] text-slate-400">Pauze duurt:</p>
                      <p className="text-sm font-bold text-amber-300">{activePauseMinutes} min</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      onClick={handleTogglePauseTimer}
                      className={`py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors ${timer.isPaused ? 'bg-amber-500 hover:bg-amber-600 text-slate-950' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}
                    >
                      {timer.isPaused ? <IconPlay className="w-4 h-4" /> : <IconPause className="w-4 h-4" />}
                      <span>{timer.isPaused ? 'Hervat Werk' : 'Pauzeer'}</span>
                    </button>

                    <button
                      onClick={handleClockOut}
                      className="bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors shadow-xs"
                    >
                      <IconStop className="w-4 h-4" />
                      <span>Uitklokken</span>
                    </button>
                  </div>
                </div>
              ) : (
                /* INKLOKKEN START STATE */
                <div className="flex items-center justify-between gap-3 pt-1">
                  <div className="text-xs space-y-0.5">
                    <p className="text-slate-300 font-medium">Klaar om te beginnen?</p>
                    <p className="text-[11px] text-slate-400">Start de live timer bij het starten van je dienst.</p>
                  </div>

                  <button
                    onClick={() => handleClockIn(selectedEmployerId !== 'all' ? selectedEmployerId : (employers[0]?.id))}
                    className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-1.5 shadow-sm transition-transform active:scale-95"
                  >
                    <IconPlay className="w-4 h-4" />
                    <span>Inklokken</span>
                  </button>
                </div>
              )}
            </div>

            {/* SAMENVATTINGSKAART (GEFILTERDE TOTALEN) */}
            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
              <div className="flex items-center justify-between text-xs text-slate-500 font-medium">
                <span>Geselecteerde Periode / Filter Samenvatting</span>
                <span className="bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded text-[10px]">
                  {filteredShifts.length} dienst(en)
                </span>
              </div>
              <div className="grid grid-cols-2 gap-4 pt-1">
                <div className="bg-white p-3 rounded-xl border border-slate-200/80">
                  <p className="text-[11px] text-slate-400 font-medium">Totaal Uren</p>
                  <p className="text-xl font-black text-emerald-600">{totalStats.hours.toFixed(1)} u</p>
                </div>
                <div className="bg-white p-3 rounded-xl border border-slate-200/80">
                  <p className="text-[11px] text-slate-400 font-medium">Totaal Verdiend</p>
                  <p className="text-xl font-black text-slate-900">{settings.currencySymbol}{totalStats.earnings.toFixed(2)}</p>
                </div>
              </div>
            </div>

            {/* SHIFTS LIST HEADER & EXCEL EXPORT BUTTON */}
            <div className="space-y-2">
              <div className="flex items-center justify-between text-xs font-bold text-slate-700">
                <span>Geregistreerde Diensten</span>
                <button
                  onClick={() => exportToExcel(filteredShifts, employers)}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 shadow-2xs transition-colors"
                  title="Download alle diensten als Microsoft Excel bestand"
                >
                  <IconFileSpreadsheet className="w-3.5 h-3.5" />
                  <span>Exporteer naar Excel (.xlsx)</span>
                </button>
              </div>

              {filteredShifts.length === 0 ? (
                <div className="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                  <IconClock className="w-8 h-8 text-slate-300 mx-auto mb-2" />
                  <p className="text-xs font-bold text-slate-600">Geen diensten gevonden voor dit filter</p>
                  <p className="text-[11px] text-slate-400 mt-0.5">Klik op "+ Nieuw" of pas je filter aan.</p>
                </div>
              ) : (
                filteredShifts.map(shift => {
                  const emp = employers.find(e => e.id === shift.employerId);
                  const calc = calculateShiftEarnings(shift, employers);

                  return (
                    <div key={shift.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between hover:border-slate-300 transition-colors">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: emp?.color || '#10B981' }} />
                          <span className="font-bold text-xs text-slate-800">{shift.date} · {emp?.name || 'Onbekend'}</span>
                        </div>
                        <p className="text-[11px] text-slate-500 font-medium">
                          {shift.startTime} - {shift.endTime} ({calc.netHours.toFixed(1)} uur netto · {shift.breakMinutes}m pauze)
                        </p>
                        {shift.notes && <p className="text-[10px] text-slate-400 italic">{shift.notes}</p>}
                      </div>

                      <div className="text-right space-y-1">
                        <p className="font-extrabold text-sm text-emerald-700">{settings.currencySymbol}{calc.earnings.toFixed(2)}</p>
                        <div className="flex items-center justify-end gap-1">
                          <button
                            onClick={() => { setEditingShift(shift); setIsShiftModalOpen(true); }}
                            className="p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-200 rounded"
                            title="Bewerken"
                          >
                            <IconEdit className="w-3.5 h-3.5" />
                          </button>
                          <button
                            onClick={() => handleDeleteShift(shift.id)}
                            className="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded"
                            title="Verwijderen"
                          >
                            <IconTrash className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </main>

          {/* BOTTOM BAR */}
          <footer className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white border-t border-slate-200 p-2 flex items-center justify-around z-30">
            <button
              onClick={() => setActiveTab('overview')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${activeTab === 'overview' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <IconClock className="w-5 h-5" />
              <span>Diensten</span>
            </button>
            <button
              onClick={() => setIsSettingsModalOpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-600"
            >
              <IconSettings className="w-5 h-5" />
              <span>Instellingen</span>
            </button>
          </footer>

          {/* MODAL 1: ADD / EDIT SHIFT */}
          {isShiftModalOpen && (
            <ShiftModal
              isOpen={isShiftModalOpen}
              onClose={() => setIsShiftModalOpen(false)}
              shift={editingShift}
              employers={employers}
              settings={settings}
              onSave={handleSaveShift}
            />
          )}

          {/* MODAL 2: FULL SETTINGS & WERKGEVERS & SYNOLOGY & BACKUP */}
          {isSettingsModalOpen && (
            <SettingsModal
              isOpen={isSettingsModalOpen}
              onClose={() => setIsSettingsModalOpen(false)}
              employers={employers}
              shifts={shifts}
              settings={settings}
              synology={synology}
              onSaveEmployer={handleSaveEmployer}
              onDeleteEmployer={handleDeleteEmployer}
              onSetDefaultEmployer={handleSetDefaultEmployer}
              onSaveSettings={(s) => { setSettings(s); saveAppSettings(s); showToast('Parameters opgeslagen!'); }}
              onSaveSynology={(syn) => { setSynology(syn); saveSynologyConfig(syn); }}
              onWipeData={handleWipeAllData}
              onRestoreBackup={handleRestoreBackup}
            />
          )}
        </div>
      );
    }

    // --- SHIFT MODAL COMPONENT ---
    function ShiftModal({ isOpen, onClose, shift, employers, settings, onSave }) {
      const defaultEmp = employers.find(e => e.isDefault) || employers[0];

      const [employerId, setEmployerId] = useState(shift ? shift.employerId : (defaultEmp ? defaultEmp.id : ''));
      const [date, setDate] = useState(shift ? shift.date : new Date().toISOString().split('T')[0]);
      const [startTime, setStartTime] = useState(shift ? shift.startTime : '09:00');
      const [endTime, setEndTime] = useState(shift ? shift.endTime : '17:00');
      const [breakMinutes, setBreakMinutes] = useState(shift ? shift.breakMinutes : settings.defaultBreakMinutes);
      const [wageOverride, setWageOverride] = useState(shift && shift.hourlyWageOverride !== undefined ? shift.hourlyWageOverride.toString() : '');
      const [notes, setNotes] = useState(shift ? shift.notes || '' : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        const newShift = {
          id: shift ? shift.id : `shift-${Date.now()}`,
          employerId,
          date,
          startTime,
          endTime,
          breakMinutes: parseInt(breakMinutes) || 0,
          hourlyWageOverride: wageOverride ? parseFloat(wageOverride) : undefined,
          notes
        };
        onSave(newShift);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-md p-4 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b pb-3">
              <h2 className="font-bold text-base text-slate-900">{shift ? 'Dienst Aanpassen' : 'Nieuwe Dienst Invoeren'}</h2>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600"><IconX className="w-5 h-5" /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Werkgever</label>
                <select
                  value={employerId}
                  onChange={e => setEmployerId(e.target.value)}
                  className="w-full bg-slate-50 border rounded-xl p-2 font-bold"
                >
                  {employers.map(e => <option key={e.id} value={e.id}>{e.name} (€{e.hourlyWage.toFixed(2)}/u)</option>)}
                </select>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Datum</label>
                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-semibold" required />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Begintijd</label>
                  <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-semibold" required />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Eindtijd</label>
                  <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-semibold" required />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Pauze (minuten)</label>
                  <input type="number" value={breakMinutes} onChange={e => setBreakMinutes(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-semibold" />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Aangepast Uurloon (€)</label>
                  <input type="number" step="0.10" placeholder="Standaard" value={wageOverride} onChange={e => setWageOverride(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-semibold" />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Opmerking</label>
                <input type="text" placeholder="bv. Toeslag uren, Locatie X" value={notes} onChange={e => setNotes(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2 font-medium" />
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t">
                <button type="button" onClick={onClose} className="px-4 py-2 font-semibold text-slate-500">Annuleren</button>
                <button type="submit" className="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold">Opslaan</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- SETTINGS & SYNOLOGY MODAL WITH HTTPS & PRIVACY COMPLIANCE ---
    function SettingsModal({
      isOpen, onClose, employers, shifts, settings, synology,
      onSaveEmployer, onDeleteEmployer, onSetDefaultEmployer, onSaveSettings, onSaveSynology, onWipeData, onRestoreBackup
    }) {
      const [tab, setTab] = useState('employers'); // employers, params, synology, data
      
      // Employer form
      const [empName, setEmpName] = useState('');
      const [empWage, setEmpWage] = useState('15.00');
      const [editingEmpId, setEditingEmpId] = useState(null);

      // Synology form with HTTPS validation & Show/Hide Key toggle
      const [synUrl, setSynUrl] = useState(synology.apiUrl || '');
      const [synKey, setSynKey] = useState(synology.apiKey || '');
      const [showApiKey, setShowApiKey] = useState(false);
      const [synStatus, setSynStatus] = useState(null);
      const [sending, setSending] = useState(false);

      // Params form
      const [breakMins, setBreakMins] = useState(settings.defaultBreakMinutes);
      const [currency, setCurrency] = useState(settings.currencySymbol);

      // Confirm Wipe Modal State
      const [showConfirmWipe, setShowConfirmWipe] = useState(false);

      // File ref for upload backup
      const fileInputRef = useRef(null);

      const handleSaveEmp = (e) => {
        e.preventDefault();
        if (!empName.trim()) return;
        onSaveEmployer({
          id: editingEmpId || `emp-${Date.now()}`,
          name: empName.trim(),
          hourlyWage: parseFloat(empWage) || 15.0,
          color: '#10B981',
          isDefault: employers.length === 0
        });
        setEmpName('');
        setEmpWage('15.00');
        setEditingEmpId(null);
      };

      // HTTPS Check for GitHub Pages / Mixed Content prevention
      const handleSendSynology = async () => {
        const trimmedUrl = synUrl.trim();
        
        if (!trimmedUrl) {
          return setSynStatus({ success: false, message: 'Vul a.u.b. een Synology API-url in.' });
        }

        // Strict HTTPS Enforcement for GitHub Pages
        if (trimmedUrl.startsWith('http://')) {
          return setSynStatus({
            success: false,
            message: '⚠️ GitHub Pages vereist HTTPS! Onbeveiligde HTTP-verzoeken worden door de browser geblokkeerd (Mixed Content Block). Gebruik een HTTPS-URL (bijv. via Synology QuickConnect / DDNS met SSL).'
          });
        }

        if (!trimmedUrl.startsWith('https://')) {
          return setSynStatus({
            success: false,
            message: 'Vul een geldige HTTPS-URL in die begint met https://'
          });
        }

        setSending(true);
        setSynStatus(null);

        const config = { apiUrl: trimmedUrl, apiKey: synKey.trim() };
        onSaveSynology(config);

        try {
          const payload = { app: 'UrenTracker', version: '1.0', totalShifts: shifts.length, employers, shifts };
          const headers = { 'Content-Type': 'application/json' };
          if (config.apiKey) headers['X-API-Key'] = config.apiKey;

          const res = await fetch(config.apiUrl, { method: 'POST', headers, body: JSON.stringify(payload) });
          setSending(false);
          if (res.ok) {
            setSynStatus({ success: true, message: `Succesvol versleuteld verzonden naar Synology NAS (${res.status})!` });
          } else {
            setSynStatus({ success: false, message: `NAS gaf statuscode ${res.status}. Controleer de URL en instellingen.` });
          }
        } catch (err) {
          setSending(false);
          setSynStatus({
            success: false,
            message: `Verbindingsfout (${err.message || 'Netwerkfout'}). Zorg dat je Synology NAS CORS-verzoeken toestaat en een geldig SSL-certificaat heeft.`
          });
        }
      };

      // Download JSON Backup
      const downloadJSON = () => {
        const jsonStr = JSON.stringify({ employers, shifts, settings, synology }, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `uren-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      // Upload JSON Backup
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed.employers && !parsed.shifts) {
              alert('Ongeldig back-up bestand.');
              return;
            }
            onRestoreBackup(parsed);
          } catch (err) {
            alert('Fout bij het lezen van het JSON bestand: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative">
            
            {/* Header */}
            <div className="p-4 border-b flex items-center justify-between bg-white">
              <div className="flex items-center gap-2">
                <IconSettings className="w-5 h-5 text-emerald-600" />
                <h2 className="font-bold text-base text-slate-900">Instellingen & Privacy Beheer</h2>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600"><IconX className="w-5 h-5" /></button>
            </div>

            {/* Tabs */}
            <div className="bg-slate-50 p-2 border-b grid grid-cols-4 gap-1 text-center text-xs font-bold">
              <button onClick={() => setTab('employers')} className={`py-1.5 rounded-lg ${tab === 'employers' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}>Werkgevers</button>
              <button onClick={() => setTab('params')} className={`py-1.5 rounded-lg ${tab === 'params' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}>Parameters</button>
              <button onClick={() => setTab('synology')} className={`py-1.5 rounded-lg ${tab === 'synology' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}>Synology NAS</button>
              <button onClick={() => setTab('data')} className={`py-1.5 rounded-lg ${tab === 'data' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-500'}`}>Data & AVG</button>
            </div>

            {/* Content */}
            <div className="p-4 overflow-y-auto space-y-4 flex-1 text-xs">
              
              {/* TAB 1: WERKGEVERS */}
              {tab === 'employers' && (
                <div className="space-y-3">
                  <form onSubmit={handleSaveEmp} className="bg-slate-50 p-3 rounded-xl border space-y-2">
                    <p className="font-bold text-slate-800">{editingEmpId ? 'Werkgever bewerken' : 'Nieuwe Werkgever Toevoegen'}</p>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="Naam werkgever" value={empName} onChange={e => setEmpName(e.target.value)} className="bg-white border rounded-lg p-2 font-semibold" required />
                      <input type="number" step="0.10" placeholder="Uurloon (€)" value={empWage} onChange={e => setEmpWage(e.target.value)} className="bg-white border rounded-lg p-2 font-semibold" required />
                    </div>
                    <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1.5 rounded-lg">Opslaan</button>
                  </form>

                  <div className="space-y-2">
                    {employers.map(emp => (
                      <div key={emp.id} className="p-2.5 bg-slate-50 border rounded-xl flex items-center justify-between">
                        <div>
                          <span className="font-bold text-slate-800">{emp.name}</span>
                          <p className="text-[11px] text-slate-500">€{emp.hourlyWage.toFixed(2)} / uur {emp.isDefault && '· Standaard'}</p>
                        </div>
                        <div className="flex items-center gap-1">
                          {!emp.isDefault && (
                            <button onClick={() => onSetDefaultEmployer(emp.id)} className="text-[10px] font-bold bg-white border px-2 py-1 rounded">Standaard</button>
                          )}
                          <button onClick={() => { setEditingEmpId(emp.id); setEmpName(emp.name); setEmpWage(emp.hourlyWage.toString()); }} className="p-1 text-slate-400 hover:text-slate-700"><IconEdit className="w-4 h-4" /></button>
                          <button onClick={() => onDeleteEmployer(emp.id)} className="p-1 text-slate-400 hover:text-rose-600"><IconTrash className="w-4 h-4" /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 2: PARAMETERS */}
              {tab === 'params' && (
                <div className="space-y-3">
                  <div className="space-y-2 bg-slate-50 p-3 rounded-xl border">
                    <label className="block font-bold">Standaard Pauze (minuten)</label>
                    <input type="number" value={breakMins} onChange={e => setBreakMins(parseInt(e.target.value) || 0)} className="w-full bg-white border rounded-lg p-2 font-semibold" />
                  </div>
                  <div className="space-y-2 bg-slate-50 p-3 rounded-xl border">
                    <label className="block font-bold">Valuta Symbool</label>
                    <input type="text" value={currency} onChange={e => setCurrency(e.target.value)} className="w-full bg-white border rounded-lg p-2 font-semibold" />
                  </div>
                  <button onClick={() => onSaveSettings({ ...settings, defaultBreakMinutes: breakMins, currencySymbol: currency })} className="w-full bg-emerald-500 text-white font-bold py-2 rounded-xl">Parameters Opslaan</button>
                </div>
              )}

              {/* TAB 3: SYNOLOGY NAS WITH HTTPS ENFORCEMENT & EYE TOGGLE */}
              {tab === 'synology' && (
                <div className="space-y-3">
                  <div className="bg-emerald-50/60 border border-emerald-200 p-3 rounded-xl space-y-1">
                    <div className="flex items-center gap-1.5 font-bold text-emerald-800 text-xs">
                      <IconShield className="w-4 h-4 text-emerald-600" />
                      <span>HTTPS Verbinding (GitHub Pages)</span>
                    </div>
                    <p className="text-[11px] text-emerald-700">
                      Omdat deze app via HTTPS op GitHub Pages draait, staat de browser alleen beveiligde `https://` verzoeken toe om Mixed Content blokkades te voorkomen.
                    </p>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border space-y-3">
                    <div>
                      <label className="block font-bold text-slate-800 mb-1">Synology HTTPS Endpoint URL *</label>
                      <input
                        type="url"
                        placeholder="https://nas.example.com:5001/api/uren"
                        value={synUrl}
                        onChange={e => setSynUrl(e.target.value)}
                        className="w-full bg-white border rounded-lg p-2 font-semibold focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-800 mb-1">API Sleutel / Authorization Token</label>
                      <div className="relative">
                        <input
                          type={showApiKey ? "text" : "password"}
                          placeholder="Optioneel geheim token"
                          value={synKey}
                          onChange={e => setSynKey(e.target.value)}
                          className="w-full bg-white border rounded-lg p-2 pr-10 font-semibold focus:ring-2 focus:ring-emerald-500"
                        />
                        <button
                          type="button"
                          onClick={() => setShowApiKey(!showApiKey)}
                          className="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600"
                          title={showApiKey ? "Verberg sleutel" : "Toon sleutel"}
                        >
                          {showApiKey ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={handleSendSynology}
                    disabled={sending}
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 shadow-xs"
                  >
                    <IconSend className="w-4 h-4" />
                    {sending ? 'Bezig met beveiligd verzenden...' : 'Verstuur nu naar Synology NAS'}
                  </button>

                  {synStatus && (
                    <div className={`p-3 rounded-xl text-xs font-semibold leading-relaxed ${synStatus.success ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-rose-50 text-rose-800 border border-rose-200'}`}>
                      {synStatus.message}
                    </div>
                  )}
                </div>
              )}

              {/* TAB 4: DATA & PRIVACY CONTROL & BACKUP / RESTORE */}
              {tab === 'data' && (
                <div className="space-y-4">
                  {/* Privacy Statement Banner */}
                  <div className="bg-slate-900 text-white p-3.5 rounded-xl space-y-1.5">
                    <div className="flex items-center gap-2 font-bold text-emerald-400">
                      <IconLock className="w-4 h-4" />
                      <span>Privacy & AVG (GDPR) Garantie</span>
                    </div>
                    <p className="text-[11px] text-slate-300 leading-relaxed">
                      Alle geregistreerde uren, tarieven en instellingen worden <strong>100% lokaal in jouw eigen browser (LocalStorage)</strong> opgeslagen. Er worden geen analytische cookies of gegevens naar externe servers verstuurd.
                    </p>
                  </div>

                  {/* Export & Restore Options */}
                  <div className="bg-slate-50 border p-3 rounded-xl space-y-2">
                    <p className="font-bold text-slate-800">Back-up & Herstel (JSON Data Portability)</p>
                    <div className="grid grid-cols-1 gap-2">
                      <button
                        onClick={() => exportToExcel(shifts, employers)}
                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg flex items-center justify-center gap-2 shadow-2xs transition-colors"
                      >
                        <IconFileSpreadsheet className="w-4 h-4" />
                        <span>Exporteer naar Excel (.xlsx)</span>
                      </button>

                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={downloadJSON}
                          className="w-full bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 shadow-2xs"
                        >
                          <IconDownload className="w-4 h-4 text-emerald-600" />
                          <span>Download Back-up (JSON)</span>
                        </button>

                        <button
                          onClick={() => fileInputRef.current?.click()}
                          className="w-full bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 shadow-2xs"
                        >
                          <IconUpload className="w-4 h-4 text-blue-600" />
                          <span>Herstel Back-up (JSON)</span>
                        </button>
                      </div>

                      <input
                        type="file"
                        ref={fileInputRef}
                        onChange={handleFileUpload}
                        accept=".json"
                        className="hidden"
                      />
                    </div>
                  </div>

                  {/* Wipe Data Section */}
                  <div className="bg-rose-50 border border-rose-200 p-3 rounded-xl space-y-2">
                    <div className="flex items-center gap-1.5 text-rose-800 font-bold">
                      <IconAlert className="w-4 h-4 text-rose-600" />
                      <span>Data Beheer & Verwijdering</span>
                    </div>
                    <p className="text-[11px] text-rose-700">
                      Wil je een schone start maken of al je persoonsgegevens uit de browser wissen?
                    </p>
                    <button
                      onClick={() => setShowConfirmWipe(true)}
                      className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition-colors"
                    >
                      <IconTrash className="w-4 h-4" />
                      <span>Alle gegevens definitief wissen</span>
                    </button>
                  </div>
                </div>
              )}

            </div>

            {/* Modal Footer */}
            <div className="p-3 bg-slate-50 border-t flex justify-end">
              <button onClick={onClose} className="bg-white border text-slate-700 font-bold px-4 py-1.5 rounded-xl">Sluiten</button>
            </div>

            {/* CONFIRM WIPE SUB-MODAL */}
            {showConfirmWipe && (
              <div className="absolute inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in">
                <div className="bg-white rounded-2xl p-4 max-w-xs w-full space-y-3 text-center shadow-2xl border border-slate-200">
                  <div className="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
                    <IconAlert className="w-6 h-6" />
                  </div>
                  <h3 className="font-bold text-slate-900 text-sm">Weet je het zeker?</h3>
                  <p className="text-xs text-slate-500">
                    Dit verwijdert onherroepelijk alle geregistreerde diensten, werkgevers en instellingen uit LocalStorage.
                  </p>
                  <div className="flex gap-2 pt-2">
                    <button
                      onClick={() => setShowConfirmWipe(false)}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs"
                    >
                      Annuleren
                    </button>
                    <button
                      onClick={() => {
                        setShowConfirmWipe(false);
                        onWipeData();
                        onClose();
                      }}
                      className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-xl text-xs"
                    >
                      Ja, alles wissen
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
